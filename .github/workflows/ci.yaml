name: Build, Test, and Deploy

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_release_wheels:
        description: Build the complete release wheel matrix without publishing
        required: false
        default: false
        type: boolean
      release_tag:
        description: Rebuild and publish an existing stable release tag from main
        required: false
        default: ""
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  lint:
    needs: get-metadata
    name: Lint (ubuntu-latest, Py 3.11)
    runs-on: ubuntu-latest
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.get-metadata.outputs.source_sha }}

      - name: Disable proxy for package installs
        run: sh scripts/ci_disable_proxy.sh

      - name: Set up Python 3.11 (GitHub)
        if: ${{ env.ACT != 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv (GitHub)
        if: ${{ env.ACT != 'true' }}
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: lint

      - name: Install uv (act)
        if: ${{ env.ACT == 'true' }}
        env:
          PYPI_INDEX_URL: https://mirrors.zju.edu.cn/pypi/web/simple
        run: sh scripts/ci_install_uv.sh

      - name: Set up Python 3.11 (act)
        if: ${{ env.ACT == 'true' }}
        run: uv python install 3.11

      - name: Lint and format check
        run: |
          uvx --from ruff==0.15.2 ruff check src
          uvx --from ruff==0.15.2 ruff format --check src

  get-metadata:
    runs-on: ubuntu-latest
    outputs:
      pkg_name: ${{ steps.package_name.outputs.value }}
      source_sha: ${{ steps.release_source.outputs.sha }}
      release_tag: ${{ steps.release_source.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve and validate release source
        id: release_source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"
          release_tag="$EVENT_TAG"
          if [ -n "$REQUESTED_TAG" ]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]]
            [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            source_sha=$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")
            git merge-base --is-ancestor "$source_sha" origin/main
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$REQUESTED_TAG" \
              --jq '(.draft == false) and (.prerelease == false) and (.target_commitish == "main")' \
              | grep -qx true
            release_tag="$REQUESTED_TAG"
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          git checkout --detach "$source_sha"
      - name: Disable proxy for package installs
        run: sh scripts/ci_disable_proxy.sh
      - name: Extract package name
        id: package_name
        run: |
          NAME=$(grep -m 1 '^name =' pyproject.toml | cut -d '"' -f 2)
          echo "value=$NAME" >> $GITHUB_OUTPUT

  build-and-test:
    needs: get-metadata
    name: Build and test on ${{ matrix.os }} (Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.get-metadata.outputs.source_sha }}

      - name: Disable proxy for package installs
        run: sh scripts/ci_disable_proxy.sh

      - name: Set up Python ${{ matrix.python-version }} (GitHub)
        if: ${{ env.ACT != 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv (GitHub)
        if: ${{ env.ACT != 'true' }}
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            ci/rdkit-constraints.txt
          cache-suffix: py${{ matrix.python-version }}

      - name: Install uv (act)
        if: ${{ env.ACT == 'true' }}
        env:
          PYPI_INDEX_URL: https://mirrors.zju.edu.cn/pypi/web/simple
        run: sh scripts/ci_install_uv.sh

      - name: Set up Python ${{ matrix.python-version }} (act)
        if: ${{ env.ACT == 'true' }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }} .venv

      - name: Install dependencies
        run: >
          uv pip install --python .venv
          --requirements pyproject.toml
          --constraint ci/rdkit-constraints.txt
          pytest pytest-cov pandas pybind11 scikit-build-core setuptools-scm
          typing-extensions 'rdkit-dof>=0.2.1' 'cmake>=3.15'

      - name: Build extension (editable install)
        run: uv pip install -e . -v --no-build-isolation --constraint ci/rdkit-constraints.txt --python .venv

      - name: Compile smoke check
        run: |
          uv run --no-sync --python ${{ matrix.python-version }} python -c "import molgr; import molgr._core"

      - name: Run tests
        run: uv run --no-sync --python ${{ matrix.python-version }} python -m pytest

  build-release-wheels:
    needs: get-metadata
    name: Build release wheels (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.build_release_wheels == true || inputs.release_tag != '')) ||
      (github.event_name == 'release' && github.event.action == 'published' &&
      github.event.release.prerelease == false &&
      github.event.release.target_commitish == 'main' &&
      startsWith(github.event.release.tag_name, 'v') &&
      !contains(github.event.release.tag_name, 'rc') &&
      !contains(github.event.release.tag_name, '.dev'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-manylinux2014-x86_64
            os: ubuntu-latest
            build: "cp38-manylinux_* cp39-manylinux_* cp310-manylinux_* cp311-manylinux_* cp312-manylinux_*"
            archs_linux: x86_64
            manylinux_x86_64_image: manylinux2014
            manylinux_aarch64_image: manylinux2014
          - target: linux-manylinux2014-aarch64
            os: ubuntu-24.04-arm
            build: "cp38-manylinux_* cp39-manylinux_* cp310-manylinux_* cp311-manylinux_* cp312-manylinux_*"
            archs_linux: aarch64
            manylinux_x86_64_image: manylinux2014
            manylinux_aarch64_image: manylinux2014
          - target: linux-manylinux_2_28-x86_64
            os: ubuntu-latest
            build: "cp313-manylinux_* cp314-manylinux_*"
            archs_linux: x86_64
            manylinux_x86_64_image: manylinux_2_28
            manylinux_aarch64_image: manylinux_2_28
          - target: linux-manylinux_2_28-aarch64
            os: ubuntu-24.04-arm
            build: "cp313-manylinux_* cp314-manylinux_*"
            archs_linux: aarch64
            manylinux_x86_64_image: manylinux_2_28
            manylinux_aarch64_image: manylinux_2_28
          - target: windows-amd64
            os: windows-latest
            build: "cp38-win_amd64 cp39-win_amd64 cp310-win_amd64 cp311-win_amd64 cp312-win_amd64 cp313-win_amd64 cp314-win_amd64"
            archs_linux: auto
            manylinux_x86_64_image: manylinux2014
            manylinux_aarch64_image: manylinux2014
          - target: macos-x86_64
            os: macos-15-intel
            archs_macos: x86_64
            build: "cp38-macosx_x86_64 cp39-macosx_x86_64 cp310-macosx_x86_64 cp311-macosx_x86_64 cp312-macosx_x86_64 cp313-macosx_x86_64 cp314-macosx_x86_64"
            archs_linux: auto
            macos_deployment_target: "14.0"
            manylinux_x86_64_image: manylinux2014
            manylinux_aarch64_image: manylinux2014
          - target: macos-arm64
            os: macos-latest
            archs_macos: arm64
            build: "cp38-macosx_arm64 cp39-macosx_arm64 cp310-macosx_arm64 cp311-macosx_arm64 cp312-macosx_arm64 cp313-macosx_arm64 cp314-macosx_arm64"
            archs_linux: auto
            macos_deployment_target: "14.0"
            manylinux_x86_64_image: manylinux2014
            manylinux_aarch64_image: manylinux2014

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.get-metadata.outputs.source_sha }}

      - name: Disable proxy for package installs
        run: sh scripts/ci_disable_proxy.sh

      - name: Set up Python 3.11 (GitHub)
        if: ${{ env.ACT != 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build wheels via cibuildwheel (GitHub)
        if: ${{ env.ACT != 'true' }}
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_ARCHS_LINUX: ${{ matrix.archs_linux }}
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ARCHS_MACOS: ${{ matrix.archs_macos || 'native' }}
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_x86_64_image }}
          CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.manylinux_aarch64_image }}
          CIBW_ENVIRONMENT: >
            PIP_INDEX_URL=https://pypi.org/simple
            PIP_DEFAULT_TIMEOUT=120
          CIBW_ENVIRONMENT_LINUX: >
            PIP_INDEX_URL=https://pypi.org/simple
            PIP_DEFAULT_TIMEOUT=120
            PIP_CONSTRAINT=/project/ci/rdkit-constraints.txt
          CIBW_ENVIRONMENT_MACOS: >
            PIP_INDEX_URL=https://pypi.org/simple
            PIP_DEFAULT_TIMEOUT=120
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_BEFORE_BUILD_WINDOWS: >
            python -m pip install
            "delvewheel==1.10.0; python_version < '3.9'"
            "delvewheel==1.13.0; python_version >= '3.9'"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            sh -c 'libdir=$(python -c "import openbabel, os; print(os.path.join(os.path.dirname(openbabel.__file__), \"lib\"))");
            case "{wheel}" in *cp38*|*cp39*) soname=libopenbabel.so.7 ;; *) soname=libopenbabel.so.8 ;; esac;
            LD_LIBRARY_PATH="$libdir:${LD_LIBRARY_PATH:-}" auditwheel repair --exclude "$soname" -w {dest_dir} {wheel}'
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >
            python -m delvewheel repair
            --exclude openbabel-3.dll
            -w {dest_dir} {wheel}
          CIBW_BEFORE_BUILD_MACOS: >
            python -m pip install -i "$PIP_INDEX_URL"
            "$(python -c 'import sys; print("openbabel-wheel>=3.1.1.22" if sys.version_info < (3, 10) else "openbabel>=3.2.0")')"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            DYLD_LIBRARY_PATH="$(python -c "import openbabel, os; print(os.path.join(os.path.dirname(openbabel.__file__), 'lib'))")"
            delocate-wheel
            --exclude libopenbabel.
            --require-archs {delocate_archs}
            -w {dest_dir} -v {wheel}
          CIBW_TEST_COMMAND: python -c "import molgr; import molgr._core; from molgr.interface import xyz_to_rdmol"

      - name: Build wheels via cibuildwheel (act)
        if: ${{ env.ACT == 'true' }}
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_ARCHS_LINUX: ${{ matrix.archs_linux }}
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ARCHS_MACOS: ${{ matrix.archs_macos || 'native' }}
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_x86_64_image }}
          CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.manylinux_aarch64_image }}
          CIBW_ENVIRONMENT: >
            PIP_INDEX_URL=https://mirrors.zju.edu.cn/pypi/web/simple
            PIP_DEFAULT_TIMEOUT=120
          CIBW_ENVIRONMENT_LINUX: >
            PIP_INDEX_URL=https://mirrors.zju.edu.cn/pypi/web/simple
            PIP_DEFAULT_TIMEOUT=120
            PIP_CONSTRAINT=/project/ci/rdkit-constraints.txt
          CIBW_ENVIRONMENT_MACOS: >
            PIP_INDEX_URL=https://mirrors.zju.edu.cn/pypi/web/simple
            PIP_DEFAULT_TIMEOUT=120
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_BEFORE_BUILD_WINDOWS: >
            python -m pip install
            "delvewheel==1.10.0; python_version < '3.9'"
            "delvewheel==1.13.0; python_version >= '3.9'"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            sh -c 'libdir=$(python -c "import openbabel, os; print(os.path.join(os.path.dirname(openbabel.__file__), \"lib\"))");
            case "{wheel}" in *cp38*|*cp39*) soname=libopenbabel.so.7 ;; *) soname=libopenbabel.so.8 ;; esac;
            LD_LIBRARY_PATH="$libdir:${LD_LIBRARY_PATH:-}" auditwheel repair --exclude "$soname" -w {dest_dir} {wheel}'
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >
            python -m delvewheel repair
            --exclude openbabel-3.dll
            -w {dest_dir} {wheel}
          CIBW_BEFORE_BUILD_MACOS: >
            python -m pip install -i "$PIP_INDEX_URL"
            "$(python -c 'import sys; print("openbabel-wheel>=3.1.1.22" if sys.version_info < (3, 10) else "openbabel>=3.2.0")')"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            DYLD_LIBRARY_PATH="$(python -c "import openbabel, os; print(os.path.join(os.path.dirname(openbabel.__file__), 'lib'))")"
            delocate-wheel
            --exclude libopenbabel.
            --require-archs {delocate_archs}
            -w {dest_dir} -v {wheel}
          CIBW_TEST_COMMAND: python -c "import molgr; import molgr._core; from molgr.interface import xyz_to_rdmol"
        run: |
          trap 'sh scripts/ci_cleanup_cibuildwheel.sh' EXIT
          PYPI_INDEX_URL=https://mirrors.zju.edu.cn/pypi/web/simple sh scripts/ci_install_uv.sh
          PYPI_INDEX_URL=https://mirrors.zju.edu.cn/pypi/web/simple . scripts/ci_install_cibuildwheel.sh
          "$CIBUILDWHEEL"

      - name: Upload release wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-wheel-${{ matrix.target }}
          path: wheelhouse/*.whl

  deploy:
    name: Deploy to PyPI
    runs-on: ubuntu-latest
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
    needs: [lint, build-and-test, build-release-wheels, get-metadata]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && github.event.action == 'published' &&
      github.event.release.prerelease == false && github.event.release.target_commitish == 'main' &&
      startsWith(github.event.release.tag_name, 'v') &&
      !contains(github.event.release.tag_name, 'rc') && !contains(github.event.release.tag_name, '.dev'))

    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.get-metadata.outputs.pkg_name }}

    permissions:
      id-token: write # 用于 PyPI Trusted Publishing
      contents: write # 💡 必须：用于将构建产物上传到 GitHub Release 页面

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.get-metadata.outputs.source_sha }}

      - name: Disable proxy for package installs
        run: sh scripts/ci_disable_proxy.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: deploy

      - name: Download release wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-wheel-*
          merge-multiple: true
          path: dist

      - name: Build sdist
        run: uv build --sdist --out-dir dist

      - name: Show distributions
        run: ls -lah dist

      - name: Publish to PyPI
        run: uv publish

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-metadata.outputs.release_tag }}
          files: dist/*
