[project]
name = "molgr"
dynamic = ["version"]
description = "Reconstruct molecular graphs from XYZ coordinates with RDKit and Open Babel."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Miao-jiong Tang" }, { name = "Ying-zi Luo" }]
maintainers = [{ name = "Miao-jiong Tang", email = "mj_t@zju.edu.cn" }]
requires-python = ">=3.8"
keywords = [
    "cheminformatics",
    "chemistry",
    "molecular graph",
    "molecular reconstruction",
    "molecular structure",
    "XYZ",
    "RDKit",
    "Open Babel",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]

dependencies = [
    "rdkit>=2023.9.6",
    "openbabel-wheel==3.1.1.22; python_version < '3.9' and sys_platform == 'win32'",
    "openbabel-wheel; python_version < '3.10' and (sys_platform != 'win32' or python_version >= '3.9')",
    "openbabel>=3.2.0; python_version >= '3.10'",
    "numpy<2; python_version == '3.8'",
    "numpy>=1.26,<2; python_version == '3.9'",
    "numpy>=1.26,<2.3; python_version >= '3.10' and python_version < '3.13'",
    "numpy>=1.26; python_version >= '3.13'",
    "typing-extensions>=4.13.2",
]


[project.urls]
Homepage = "https://github.com/gentle1999/MolGR"
Repository = "https://github.com/gentle1999/MolGR"
Documentation = "https://github.com/gentle1999/MolGR/tree/main/docs"
Issues = "https://github.com/gentle1999/MolGR/issues"

[build-system]
requires = [
    "scikit-build-core>=1.0",
    "setuptools-scm",
    "pybind11",
    "openbabel-wheel==3.1.1.22; python_version < '3.9' and sys_platform == 'win32'",
    "openbabel-wheel; python_version < '3.10' and (sys_platform != 'win32' or python_version >= '3.9')",
    "openbabel>=3.2.0; python_version >= '3.10'",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src/molgr"]

# 生成 _version.py (包含在 sdist 中)
sdist.include = ["src/molgr/_version.py"]

# ✅ 这是官方原生支持的 Provider
[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
write_to = "src/molgr/_version.py"

[dependency-groups]
dev = [
    "ipykernel",
    "ipywidgets",
    "mypy",
    "pandas>=2.0.3; python_version < '3.12'",
    "pandas>=2.2; python_version >= '3.12'",
    "pybind11>=3.0.1",
    "py-spy>=0.3.14",
    "pytest",
    "pytest-cov",
    "rich",
    "ruff",
    "scikit-build-core>=1.0",
    "scipy>=1.10.1",
    "setuptools-scm>=9.2.2",
    "jinja2",
    "pybind11-stubgen>=2.5.5",
    "rdkit-dof>=0.2.1",
    "pyright>=1.1.408",
]

[tool.ruff]
exclude = [".git", ".venv", "__pycache__", "build", "dist"]
line-length = 100
indent-width = 4
target-version = "py38"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",
    "W",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort 
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions 
    "UP",  # pyupgrade 
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "UP045", # don't suggest X | None on py38
    "UP006",
    "UP007",
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "stress: resource-intensive native concurrency and memory stress tests",
]


[tool.mypy]
warn_return_any = false       # 允许函数返回 Any (这对调用未加类型的第三方库很有用)
warn_unused_configs = true    # 警告无用的配置
explicit_package_bases = true # 配合 src 目录结构

disallow_untyped_defs = false # 关键！允许编写没有类型注解的函数
disallow_any_generics = false # 允许使用 List, Dict 而不必须写 List[int]

check_untyped_defs = true   # 关键！即使函数没写注解，也要检查函数内部的逻辑错误
no_implicit_optional = true # 禁止隐式的 Optional (即禁止 x: str = None)
warn_redundant_casts = true # 警告多余的 cast
warn_unused_ignores = false # 警告多余的 # type: ignore

ignore_missing_imports = true
no_site_packages = true
exclude = "^(tests/|scripts/|build/|dist/|src/molgr/_core/)"

[tool.pyright]
include = ["src"]
exclude = [
    "**/.*",
    "build",
    "dist",
    "__pycache__",
    "**/node_modules",
    ".venv",
    ".venv-benchmark",
]
pythonVersion = "3.8"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
